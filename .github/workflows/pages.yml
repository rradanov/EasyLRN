# Publish the static site to GitHub Pages on every push to main.
# Requires: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Publish only the app itself: no tests, tooling or package files.
      # Keep this list in sync with the app files (and the SHELL list in sw.js).
      - name: Collect app files
        run: |
          mkdir _site
          cp index.html parser.html manifest.webmanifest sw.js _site/
          cp -r src styles vendor icons _site/
          touch _site/.nojekyll
          find _site -type f | sort

      # Every file the Service Worker precaches must be published, or the
      # new SW fails to install and users stay on the old version forever.
      - name: Check precache list
        run: |
          missing=0
          for f in $(sed -n '/^const SHELL = \[/,/^\];/p' sw.js | grep -oE "'\./[^']*'" | tr -d "'" | sed 's#^\./##'); do
            [ -z "$f" ] && continue
            if [ ! -e "_site/$f" ]; then echo "MISSING in _site: $f"; missing=1; fi
          done
          exit $missing

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
