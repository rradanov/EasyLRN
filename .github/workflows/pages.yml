# Publish the static site to GitHub Pages on every push to main.
# Requires: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Publish only the app itself: no tests, tooling or package files.
      # Keep this list in sync with the app files (and the SHELL list in sw.js).
      - name: Collect app files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r src styles vendor icons _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
